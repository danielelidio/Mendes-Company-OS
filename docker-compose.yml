services:
  back-end:
    build:
      context: ./back-end
      dockerfile: Dockerfile.dev
    container_name: mc-os-back-end
    ports:
      - "3002:3002"
    volumes:
      - ./back-end:/app
      - back_end_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3002
      - CHOKIDAR_USEPOLLING=true
    command: npm run start:dev

  app:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    container_name: mc-os-app
    ports:
      - "8082:8082"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "19006:19006"
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
      - EXPO_NO_TELEMETRY=1
    depends_on:
      - back-end
    command: npx expo start --web --port 8082 --host lan

volumes:
  back_end_node_modules:
  app_node_modules:

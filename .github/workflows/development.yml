name: CI/CD (development)

# Roda testes em PRs e pushes para `development`;
# faz deploy ao Firebase Hosting do ambiente de dev só em push na `development`.
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (tsc + unit + E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Emuladores Firebase (Firestore/Storage) precisam de Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: app
        # npm install (não ci) para reconciliar deps transitivas que variam entre
        # SO/versões de npm (peers opcionais de expo-router/react-native).
        run: npm install --no-audit --no-fund

      - name: Type-check
        working-directory: app
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: app
        run: npm test -- --ci

      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # emulators:exec sobe os emuladores, roda o E2E e os derruba ao final.
      # O Playwright (config) sobe o app web em :3010 e conecta nos emuladores em localhost.
      - name: Run E2E against emulators
        run: firebase emulators:exec --project mendes-company-os-dev --only auth,firestore,storage 'cd app && npm run e2e'
        env:
          # Config de teste (modo emulador ignora a apiKey; o projectId precisa bater).
          EXPO_PUBLIC_FIREBASE_API_KEY: demo-api-key
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: mendes-company-os-dev.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: mendes-company-os-dev
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: mendes-company-os-dev.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          EXPO_PUBLIC_FIREBASE_APP_ID: demo-app-id

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Firebase Hosting (dev)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    # Usa os secrets do Environment "development" (service account + config do projeto dev).
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        # npm install (não ci) para reconciliar deps transitivas que variam entre
        # SO/versões de npm (peers opcionais de expo-router/react-native).
        run: npm install --no-audit --no-fund

      # Build web estático do Expo (gera app/dist) com a config do ambiente de dev.
      - name: Build web
        working-directory: app
        run: npx expo export --platform web
        env:
          # Habilita ferramentas de dev (ex.: botão "Limpar tudo") no ambiente de desenvolvimento.
          EXPO_PUBLIC_APP_ENV: development
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}

      - name: Deploy to Firebase Hosting (live channel do projeto dev)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # projectId vem do Environment → o mesmo workflow aponta para outro projeto em prod.
          projectId: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          channelId: live
